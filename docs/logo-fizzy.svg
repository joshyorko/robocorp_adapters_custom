    <path d="M151 270 C175 287 205 287 229 270" fill="none" stroke="#083B7A" stroke-width="10" stroke-linecap="round"/>
    <line x1="190" y1="111" x2="190" y2="76" stroke="#0F63D8" stroke-width="14" stroke-linecap="round"/>
    <circle cx="190" cy="66" r="20" fill="#1686EA"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M319 209 H380" stroke="#A7B8C8" stroke-width="12"/>
    <path d="M760 209 H820" stroke="#A7B8C8" stroke-width="12"/>
    <path d="M380 209 L362 191 M380 209 L362 227" stroke="#A7B8C8" stroke-width="8"/>
    <path d="M820 209 L802 191 M820 209 L802 227" stroke="#A7B8C8" stroke-width="8"/>
