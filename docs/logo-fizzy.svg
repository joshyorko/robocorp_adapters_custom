<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">robocorp_adapters_custom with Fizzy/Codex orchestration</title>
  <desc id="desc">Project banner showing a Robocorp-style adapter robot, work item queue, Fizzy board cards, and Codex execution path.</desc>
  <defs>
    <linearGradient id="robot-blue" x1="0" y1="55" x2="260" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33A7FF"/>
      <stop offset="1" stop-color="#0F63D8"/>
    </linearGradient>
    <linearGradient id="queue-green" x1="360" y1="118" x2="742" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#20D6A1"/>
      <stop offset="1" stop-color="#8DD948"/>
    </linearGradient>
    <linearGradient id="panel-coral" x1="800" y1="100" x2="1080" y2="318" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB14A"/>
      <stop offset="1" stop-color="#FF6B6B"/>
    </linearGradient>
    <filter id="soft-shadow" x="-12%" y="-18%" width="124%" height="136%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B1826" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="#F7FAFC"/>
  <rect x="28" y="28" width="1144" height="364" rx="28" fill="#FFFFFF" stroke="#D8E3EC" stroke-width="2"/>

  <g filter="url(#soft-shadow)">
